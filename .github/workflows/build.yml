name: Build Android + iOS

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: NetSet-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate Xcode project
        run: |
          chmod +x gradlew
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build iOS app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/NetSet.xcodeproj -scheme NetSet -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build | tail -200

      - name: Run in iPhone simulator and capture screenshots
        run: |
          set -x
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | test("^iPhone 1[5-9]( Pro)?$"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/ios/Build/Products/Debug-iphonesimulator/NetSet.app
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=com.nexonvate.netset

          shoot() { # $1 = screen, $2 = file name, $3 = wait seconds
            xcrun simctl terminate "$UDID" $BUNDLE || true
            xcrun simctl launch "$UDID" $BUNDLE -netsetScreen "$1"
            sleep "${3:-8}"
            xcrun simctl io "$UDID" screenshot "shots/$2.png"
          }

          # First launch seeds the demo students
          xcrun simctl launch "$UDID" $BUNDLE
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/01_home_light.png

          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            shoot home "02_home_$mode"
            shoot students "03_students_$mode"
            shoot report "04_report_$mode"
            shoot pdf "05_pdf_preview_$mode" 15
            shoot drills "06_drills_$mode"
            shoot managedrills "07_manage_drills_$mode"
            shoot matches "08_matches_$mode"
            shoot coach "09_coach_$mode"
          done

          DATA=$(xcrun simctl get_app_container "$UDID" $BUNDLE data)
          find "$DATA" -name "*.pdf" -exec cp {} shots/ \;
          xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "NetSet"' > shots/app-log.txt || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetSet-ios-simulator-screenshots
          path: shots

      - name: Package simulator app
        if: success()
        run: cd build/ios/Build/Products/Debug-iphonesimulator && zip -qr ../../../../../NetSet-ios-simulator.zip NetSet.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NetSet-ios-simulator-app
          path: NetSet-ios-simulator.zip
